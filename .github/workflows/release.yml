name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Hoisted here because the `secrets` context cannot be read from a
      # step-level `if`. Absent secrets become empty strings, not failures.
      CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CF_PROJECT: ${{ secrets.CURSEFORGE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip numpy pillow lupa

      # Never ship an addon that will not load. Same checks as CI.
      - name: Lua 5.1 syntax check
        run: python tools/luacheck.py

      - name: Pixel bridge round trip
        run: python tools/selftest.py

      # The equipper is the only code that changes your character, and its
      # worst failure is silent: reporting a swap that did not happen.
      - name: Equipper behaviour
        run: python tools/test_equipper.py

      - name: Build addon zip
        run: python tools/package.py

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.md
          generate_release_notes: true

      # Optional. Runs only once CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID
      # are set in the repository secrets, which needs a CurseForge project to
      # exist first. Without them this step is skipped, not failed.
      - name: Upload to CurseForge
        if: env.CF_TOKEN != '' && env.CF_PROJECT != ''
        run: python tools/upload_curseforge.py
